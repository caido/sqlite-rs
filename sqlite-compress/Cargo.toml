[package]
name = "sqlite-compress"
authors = ["Caido Labs Inc. <dev@caido.io>"]
repository = "https://github.com/caido/sqlite-rs"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
zstd = { version = "0.13", features = ["zdict_builder"] }
parking_lot = "0.12"
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = { workspace = true }
libsqlite3-sys = { workspace = true }
sqlite-ffi = { workspace = true }
sqlite-ffi-macros = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bundled"]
bundled = [
    "sqlite-ffi/bundled",
    "libsqlite3-sys/bundled",
]
loadable_extension = [
    "sqlite-ffi/loadable_extension",
    "libsqlite3-sys/loadable_extension",
]