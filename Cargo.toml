[workspace]
members = [
  "sqlite-compress",
  "crates/sqlite-ffi",
  "crates/sqlite-ffi-macros",
]
resolver = "2"

[workspace.dependencies]
thiserror = "2.0.20"
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite", package = "libsqlite3-sys" }

[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite", package = "libsqlite3-sys" }