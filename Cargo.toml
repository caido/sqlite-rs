[workspace]
members = [
  "sqlite-compress",
  "reglite",
  "crates/sqlite-ffi",
  "crates/sqlite-ffi-macros",
]
resolver = "2"

[workspace.dependencies]
thiserror = "2.0"
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite", rev = "91f876c",package = "libsqlite3-sys" }
sqlite-ffi = { version = "0.1.0", path = "crates/sqlite-ffi", default-features = false }
sqlite-ffi-macros = { version = "0.1.0", path = "crates/sqlite-ffi-macros" }