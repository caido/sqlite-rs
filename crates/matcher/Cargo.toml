[package]
name = "matcher"
authors = ["Caido Labs Inc. <dev@caido.io>"]
repository = "https://github.com/caido/sqlite-rs"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
memchr = { version = "2.8.3", default-features = false, features = ["alloc"] }
regex-automata = { version = "0.4", default-features = false, features = [
    "std",
    "syntax",
    "unicode",
    "hybrid",
    "perf-inline",
] }
thiserror = { workspace = true }
