[package]
name = "reglite"
authors = ["Caido Labs Inc. <dev@caido.io>"]
repository = "https://github.com/caido/sqlite-rs"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
libsqlite3-sys = { workspace = true }
regex = "1"
sqlite-ffi = { workspace = true }
sqlite-ffi-macros = { workspace = true }
thiserror = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bundled","ignore-invalid"]
ignore-invalid = []
bundled = [
    "sqlite-ffi/bundled",
    "libsqlite3-sys/bundled",
]
loadable_extension = [
    "sqlite-ffi/loadable_extension",
    "libsqlite3-sys/loadable_extension",
]